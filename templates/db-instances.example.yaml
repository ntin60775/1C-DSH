# db-instances.yaml — инстансы 1c-db одного проекта (машино-локальный файл,
# держится вне git). Файл необязателен: без него start_1c_db.sh работает в
# моно-режиме (связь из v8project.local.yaml, дисплей :97).
#
# Скопируй в .zcode/1c/db-instances.yaml и заполни по инстансу; старт —
# start_1c_db.sh <корень> --instance <имя>:
#   connection   — строка подключения 1С (файловая база: File=…)
#   user         — пользователь базы
#   password     — пароль базы (только здесь; в лог и чат не печатается).
#                  Пустой валиден — база без пароля: password: ""
#   channel      — канал изоляции прокси, ?channel=; латиница/цифры/_/-,
#                  до 64 символов; не задан — имя инстанса. Перекрывает
#                  1c_db.channel из contour.json
#   display      — номер X-дисплея для --headless без двоеточия (98, 99);
#                  не задан — свободный из пула 97–99; без --headless
#                  не используется
#   publish_port — порт публикации; хранится здесь, пока не читается:
#                  публикация берёт 1c.publish.port из contour.json
#                  (этап 4 мультистенда)
#
# start_1c_db.sh --instance X отказывает (exit 2), пока в записи нет
# connection, user или password, connection/user пусты, канал вне
# [A-Za-z0-9_-]{1,64} или имя не годится в путь kill-маркера
# build/.1c-db-autostart-<имя> (нельзя «/», «\», начало с «.») — фолбэка
# на main нет.
instances:
  base2:
    channel: base2
    connection: File=build/ib/base2
    user: ""
    password: ""
    display: 98
    publish_port: 6011
