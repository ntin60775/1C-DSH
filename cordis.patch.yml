# Контур 1С в профиле DSH — одна хост-строка. Идентификатор строки
# стабилен: его адресует пользовательский слой профиля при перенастройке.
#
# Плагин `dsh-1c-contour` несёт гейты правок И доставку контура (скиллы,
# команды /1c-*, MCP проекта). Доставка — аддитив к ЛЮБОМУ пресету сессии:
# правило одно — каталог сессии резолвится в проект 1С (маркер `.dsh/1c`).
# Вне 1С-проекта контура не видно. Отдельного пресета контура нет: копия
# `standard` не нужна, умолчание профиля (`selectedDefault`) контур не
# трогает. Ролевые пресеты (стековые и любые будущие) получают доставку
# тем же хостом без строк доставки и пресетных швов.
- insert:
    - id: 1c-contour
      name: 'dsh-1c-contour'