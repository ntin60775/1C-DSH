# Локальный оверлей машины: в git не попадает.
# Файловая база на Linux — мутации через ibcmd (headless): пакетный
# конфигуратор падает по GTK в Wayland-сессии (разовый обход:
# env -u WAYLAND_DISPLAY GDK_BACKEND=x11). Раннер 0.17 по умолчанию
# ведёт полные операции ibcmd-ом, а инкрементальные — живым агентом;
# пины ниже фиксируют ibcmd для всех операций с исходниками и ИБ —
# детерминизм headless-контура, конфигуратор и агент не используются.
# Пин строгий: не готов ibcmd — отказ, без отката на агента.
# launch не пинится: единственный исполнитель — клиент платформы.
# make: ibcmd — декларация: раннер исполняет make только
# Конфигуратором и пин make не читает; контур make запрещает гейтом
# no-designer, сборка epf/erf — ibcmd-скрипты epf-load/epf-dump.
infobases:
  origin:
    connection: '{ib_connection}'   # БЕЗ user/password внутри строки
    # user: <пользователь ИБ>       # пароль — не в git, не в чат
    # password: <через env или этот файл, но не в общий v8project.yaml>
providers:
  push: ibcmd
  pull: ibcmd
  download: ibcmd
  make: ibcmd
  infobase.create: ibcmd
  infobase.dump: ibcmd
  infobase.restore: ibcmd
  extensions: ibcmd
tools:
  platform:
    path: '/opt/1cv8/x86_64/<версия>'   # каталог установки, БЕЗ strict-пина:
                                        # строгая проверка версии ломается
                                        # на установке без версии в пути
# Тест-дерево: файл .dsh/1c/contour со словом test (прод по умолчанию,
# fail-closed; см. навык 1c-contour). Ключ `contour:` в ЭТОМ файле писать
# нельзя: v8-runner 0.15 отвергает незнакомый верхнеуровневый ключ
# local-слоя (`bad_value`) и любая unica.run-операция падает.
