# OntoShip role registry.
# One [agents.<name>] section per role; `model` is required.
# 09.11: оператор назначил все роли на модель сессии DSH
# (deepseek-account/deepseek-flash) — отдельной модели критика в DSH нет;
# независимость критика держится чтением артефактов (спека + тикеты), а не
# моделью. 09.11, позже: ревью-панель переведена на Qwen3.8 Flash (xhigh).
# 10.11: критик — Qwen3.8 Max (medium), куратор — Qwen3.8 Flash (xhigh);
# весь реестр на qwen-token-plan, критик отличается от модели сессии.
# `level` is the role's reasoning level, written verbatim into the definition;
# with the key absent the launch-time check falls back to the maximum
# available (onto-doc decisions 3 and 4) — the generator only omits the line.
# A level value is a bare token: letters, digits, '.', '_', '-'.

[agents.reviewer-spec]
model = "qwen-token-plan/qwen3.8-flash"
level = "xhigh"

[agents.reviewer-tests]
model = "qwen-token-plan/qwen3.8-flash"
level = "xhigh"

[agents.reviewer-code]
model = "qwen-token-plan/qwen3.8-flash"
level = "xhigh"

[agents.reviewer-kb]
model = "qwen-token-plan/qwen3.8-flash"
level = "xhigh"

[agents.critic]
model = "qwen-token-plan/qwen3.8-max"
level = "medium"

[agents.curator]
model = "qwen-token-plan/qwen3.8-flash"
level = "xhigh"
