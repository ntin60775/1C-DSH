# OntoShip role registry.
# One [agents.<name>] section per role; `model` is required.
# 16.11: ревью-панель и куратор — qwen-token-plan-deepseek
# (deepseek-v4.1-flash-1017), критик — qwen-token-plan-max
# (qwen4-max): критик отличается от модели сессии; 22.11 preview снят
# из каталога — маршрут приведён к канону init.
# `level` is the role's reasoning level, written verbatim into the definition;
# with the key absent the launch-time check falls back to the maximum
# available (onto-doc decisions 3 and 4) — the generator only omits the line.
# A level value is a bare token: letters, digits, '.', '_', '-'.

[agents.reviewer-spec]
model = "qwen-token-plan-deepseek/deepseek-v4.1-flash-1017"
level = "max"

[agents.reviewer-tests]
model = "qwen-token-plan-deepseek/deepseek-v4.1-flash-1017"
level = "max"

[agents.reviewer-code]
model = "qwen-token-plan-deepseek/deepseek-v4.1-flash-1017"
level = "max"

[agents.reviewer-kb]
model = "qwen-token-plan-deepseek/deepseek-v4.1-flash-1017"
level = "max"

[agents.critic]
model = "qwen-token-plan-max/qwen4-max"
level = "xhigh"

[agents.curator]
model = "qwen-token-plan-deepseek/deepseek-v4.1-flash-1017"
level = "high"

# Пул flash для проекционной валидации (скилл critic). Маршруты и уровни
# сверены с живым каталогом 20.11; решение оператора 20.11 — стандартная
# раскладка. Модель под срез выбирает основная сессия с причиной в отчёте.
[validation]
pool = [
  { model = "deepseek-account/deepseek-flash", level = "max" },
  { model = "qwen-token-plan/qwen3.8-flash", level = "xhigh" },
]